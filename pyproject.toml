[project]
name = "a2a-mcp"
version = "0.1.0"
description = "An MCP server for the Agent2Agent (A2A) protocol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "a2a-sdk>=0.3.21",
    "loguru>=0.7.3",
    "mcp>=1.2.0",
]

[dependency-groups]
dev = [
    "mypy>=1.19.0",
    "ruff>=0.14.9",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.mypy]
python_version = "3.13"
strict = true
